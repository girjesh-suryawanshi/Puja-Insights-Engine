version: '3.8'

services:
  # 1. Database Service (獨立資料庫)
  puja-db:
    image: postgres:18-alpine
    container_name: puja-db-prod
    restart: always
    environment:
      - POSTGRES_USER=puja_admin
      - POSTGRES_PASSWORD=puja_pwd_change_me
      - POSTGRES_DB=puja_insights
    ports:
      - "5436:5432" # Unique Port to avoid conflicts
    volumes:
      - puja_db_data:/var/lib/postgresql/data
    networks:
      - puja-net

  # 2. Backend API Service
  puja-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: puja-api-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://puja_admin:puja_pwd_change_me@puja-db:5432/puja_insights
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - puja-db
    networks:
      - puja-net

  # 3. Frontend Web Service (Nginx)
  puja-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: puja-web-prod
    restart: always
    ports:
      - "4009:80" # Unique Port to avoid conflicts (matching your pattern)
    depends_on:
      - puja-api
    networks:
      - puja-net

volumes:
  puja_db_data:

networks:
  puja-net:
    driver: bridge
