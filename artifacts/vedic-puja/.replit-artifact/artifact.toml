kind = "web"
previewPath = "/"
title = "Vedic Puja Services"
version = "1.0.0"
id = "artifacts/vedic-puja"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24907

[services.development]
run = "pnpm --filter @workspace/vedic-puja run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vedic-puja", "run", "build" ]
publicDir = "artifacts/vedic-puja/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24907"
BASE_PATH = "/"
