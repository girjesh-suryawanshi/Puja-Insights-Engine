  <!-- Automatic WhatsApp & Phone Call Conversion Tracker -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.addEventListener("click", function (event) {
        var target = event.target.closest("a");
        if (!target) return;
        var href = target.getAttribute("href") || "";
        // 1. Track Floating WhatsApp Icon & All WhatsApp Links
        if (href.includes("wa.me") || href.includes("whatsapp.com") || href.includes("api.whatsapp.com")) {
          if (typeof window.gtag === "function") {
            window.gtag("event", "conversion", {
              "send_to": "AW-18089240965",
              "transport_type": "beacon"
            });
          }
          if (window.dataLayer) {
            window.dataLayer.push({
              "event": "whatsapp_click",
              "puja_whatsapp_click": true,
              "link_url": href
            });
          }
        }
        // 2. Track Floating Phone Icon & All Call Links (tel:)
        if (href.startsWith("tel:")) {
          if (typeof window.gtag === "function") {
            window.gtag("event", "conversion", {
              "send_to": "AW-18089240965",
              "transport_type": "beacon"
            });
          }
          if (window.dataLayer) {
            window.dataLayer.push({
              "event": "phone_call_click",
              "puja_call_click": true,
              "link_url": href
            });
          }
        }
      });
    });
  </script>
